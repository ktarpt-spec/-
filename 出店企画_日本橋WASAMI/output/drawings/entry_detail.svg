<text x="14.00" y="267.00" font-size="2.15" fill="#7a726b" text-anchor="start" font-weight="normal" font-family="'IPAGothic','IPAPGothic',sans-serif" >・既設アプローチ（風除室）は区画内。道路側のガラス両開き扉・上部FIXガラスは既設（A工事）のまま使用し、加工しない。</text>
<text x="14.00" y="270.40" font-size="2.15" fill="#7a726b" text-anchor="start" font-weight="normal" font-family="'IPAGothic','IPAPGothic',sans-serif" >・当社工事（C工事）は、奥の店内へのガラス扉（自動または手動）、木調の袖壁・欄間仕上、店名ロゴ、間接照明。</text>
<text x="14.00" y="273.80" font-size="2.15" fill="#7a726b" text-anchor="start" font-weight="normal" font-family="'IPAGothic','IPAPGothic',sans-serif" >・ロゴは道路側ガラス面から1,700mm以上奥に位置し、ガラス面から600mm以上の離隔を確保。グレアのない電球色の間接光のみ。</text>
<text x="14.00" y="277.20" font-size="2.15" fill="#7a726b" text-anchor="start" font-weight="normal" font-family="'IPAGothic','IPAPGothic',sans-serif" >・床は既設の仕上・スロープ（バリアフリー）をそのまま使用。寸法は1F CAD・募集図面からの読取り値（実施設計時に確定）。</text>
